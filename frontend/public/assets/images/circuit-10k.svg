<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" width="100%" height="100%">
  <defs>
    <linearGradient id="neonPath10" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF0B53"/>
      <stop offset="40%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#00D2FF"/>
    </linearGradient>
    <linearGradient id="elevArea" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#16042E" stop-opacity="0.0"/>
    </linearGradient>
    <filter id="circuitGlow">
      <feGaussianBlur stdDeviation="5" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background grid subtle lines -->
  <g stroke="rgba(255, 255, 255, 0.05)" stroke-width="1">
    <line x1="20" y1="60" x2="520" y2="60"/>
    <line x1="20" y1="120" x2="520" y2="120"/>
    <line x1="20" y1="180" x2="520" y2="180"/>
    <line x1="20" y1="240" x2="520" y2="240"/>
    <line x1="100" y1="30" x2="100" y2="260"/>
    <line x1="240" y1="30" x2="240" y2="260"/>
    <line x1="380" y1="30" x2="380" y2="260"/>
  </g>

  <!-- Route Path Simulation (Bolívar to Sucre) -->
  <path d="M 80 220 
           C 110 210, 130 170, 160 180 
           C 200 195, 220 140, 260 130 
           C 310 115, 340 160, 390 120 
           C 420 95, 450 110, 480 80"
        fill="none" stroke="url(#neonPath10)" stroke-width="6" stroke-linecap="round" filter="url(#circuitGlow)"/>

  <!-- Secondary inner glow line -->
  <path d="M 80 220 
           C 110 210, 130 170, 160 180 
           C 200 195, 220 140, 260 130 
           C 310 115, 340 160, 390 120 
           C 420 95, 450 110, 480 80"
        fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>

  <!-- Start Point (Bolívar) -->
  <circle cx="80" cy="220" r="10" fill="#FF0B53" filter="url(#circuitGlow)"/>
  <circle cx="80" cy="220" r="4" fill="#FFFFFF"/>
  <text x="80" y="248" font-family="'Montserrat', sans-serif" font-weight="800" font-size="12" fill="#FFFFFF" text-anchor="middle">SALIDA</text>
  <text x="80" y="262" font-family="'Inter', sans-serif" font-size="10" fill="#A39BB5" text-anchor="middle">Bolívar (0 KM)</text>

  <!-- Midpoint Hydration -->
  <circle cx="260" cy="130" r="6" fill="#00D2FF"/>
  <text x="260" y="115" font-family="'Inter', sans-serif" font-size="9" font-weight="bold" fill="#00D2FF" text-anchor="middle">💧 KM 5.2</text>

  <!-- Finish Point (Sucre) -->
  <circle cx="480" cy="80" r="10" fill="#00E676" filter="url(#circuitGlow)"/>
  <circle cx="480" cy="80" r="4" fill="#FFFFFF"/>
  <text x="480" y="60" font-family="'Montserrat', sans-serif" font-weight="800" font-size="12" fill="#00E676" text-anchor="middle">META</text>
  <text x="480" y="44" font-family="'Inter', sans-serif" font-size="10" fill="#A39BB5" text-anchor="middle">Sucre (10.5 KM)</text>

  <!-- Altimetry profile box (like MMS) -->
  <rect x="30" y="280" width="480" height="85" rx="12" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.08)"/>
  
  <text x="50" y="302" font-family="'Montserrat', sans-serif" font-size="10" font-weight="bold" fill="#A39BB5" letter-spacing="1">PERFIL ALTIMÉTRICO</text>
  <text x="490" y="302" font-family="'Inter', sans-serif" font-size="10" font-weight="bold" fill="#A855F7" text-anchor="end">DESNIVEL +185m</text>

  <!-- Altitude Graph Line -->
  <path d="M 50 350 L 120 342 L 180 348 L 260 325 L 340 338 L 410 320 L 490 310 L 490 355 L 50 355 Z" fill="url(#elevArea)"/>
  <path d="M 50 350 L 120 342 L 180 348 L 260 325 L 340 338 L 410 320 L 490 310" fill="none" stroke="#A855F7" stroke-width="2"/>
</svg>

