<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" width="100%" height="100%">
  <defs>
    <linearGradient id="neonPath6" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E676"/>
      <stop offset="60%" stop-color="#00D2FF"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="elevArea6" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00E676" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#16042E" stop-opacity="0.0"/>
    </linearGradient>
    <filter id="circuitGlow6">
      <feGaussianBlur stdDeviation="5" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background grid subtle lines -->
  <g stroke="rgba(255, 255, 255, 0.05)" stroke-width="1">
    <line x1="20" y1="60" x2="520" y2="60"/>
    <line x1="20" y1="120" x2="520" y2="120"/>
    <line x1="20" y1="180" x2="520" y2="180"/>
    <line x1="20" y1="240" x2="520" y2="240"/>
    <line x1="100" y1="30" x2="100" y2="260"/>
    <line x1="240" y1="30" x2="240" y2="260"/>
    <line x1="380" y1="30" x2="380" y2="260"/>
  </g>

  <!-- Route Path Simulation (La Peña to Sucre) -->
  <path d="M 90 200 
           C 140 190, 180 150, 230 160 
           C 280 170, 330 120, 390 130 
           C 430 135, 455 100, 480 85"
        fill="none" stroke="url(#neonPath6)" stroke-width="6" stroke-linecap="round" filter="url(#circuitGlow6)"/>

  <!-- Secondary inner line -->
  <path d="M 90 200 
           C 140 190, 180 150, 230 160 
           C 280 170, 330 120, 390 130 
           C 430 135, 455 100, 480 85"
        fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>

  <!-- Start Point (La Peña) -->
  <circle cx="90" cy="200" r="10" fill="#00E676" filter="url(#circuitGlow6)"/>
  <circle cx="90" cy="200" r="4" fill="#FFFFFF"/>
  <text x="90" y="228" font-family="'Montserrat', sans-serif" font-weight="800" font-size="12" fill="#FFFFFF" text-anchor="middle">SALIDA</text>
  <text x="90" y="242" font-family="'Inter', sans-serif" font-size="10" fill="#A39BB5" text-anchor="middle">La Peña (0 KM)</text>

  <!-- Midpoint Hydration -->
  <circle cx="280" cy="170" r="6" fill="#00D2FF"/>
  <text x="280" y="155" font-family="'Inter', sans-serif" font-size="9" font-weight="bold" fill="#00D2FF" text-anchor="middle">💧 KM 3.0</text>

  <!-- Finish Point (Sucre) -->
  <circle cx="480" cy="85" r="10" fill="#A855F7" filter="url(#circuitGlow6)"/>
  <circle cx="480" cy="85" r="4" fill="#FFFFFF"/>
  <text x="480" y="65" font-family="'Montserrat', sans-serif" font-weight="800" font-size="12" fill="#A855F7" text-anchor="middle">META</text>
  <text x="480" y="50" font-family="'Inter', sans-serif" font-size="10" fill="#A39BB5" text-anchor="middle">Sucre (6 KM aprox)</text>

  <!-- Altimetry profile box -->
  <rect x="30" y="280" width="480" height="85" rx="12" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.08)"/>
  
  <text x="50" y="302" font-family="'Montserrat', sans-serif" font-size="10" font-weight="bold" fill="#A39BB5" letter-spacing="1">PERFIL ALTIMÉTRICO</text>
  <text x="490" y="302" font-family="'Inter', sans-serif" font-size="10" font-weight="bold" fill="#00E676" text-anchor="end">DESNIVEL +45m</text>

  <!-- Altitude Graph Line -->
  <path d="M 50 350 L 140 345 L 220 338 L 310 330 L 400 325 L 490 320 L 490 355 L 50 355 Z" fill="url(#elevArea6)"/>
  <path d="M 50 350 L 140 345 L 220 338 L 310 330 L 400 325 L 490 320" fill="none" stroke="#00E676" stroke-width="2"/>
</svg>

