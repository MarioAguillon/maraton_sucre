<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0.0" />
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#FF0B53" />
    </linearGradient>
    <linearGradient id="speedGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF0B53" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#00D2FF" stop-opacity="0" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Aura Glow -->
  <circle cx="200" cy="240" r="150" fill="url(#bgGlow)" filter="url(#glow)"/>

  <!-- Speed Lines -->
  <path d="M 40 280 L 160 280 M 20 310 L 140 310 M 60 250 L 180 250 M 30 340 L 130 340" stroke="url(#speedGrad)" stroke-width="3" stroke-linecap="round"/>

  <!-- Athlete Figure (Silhouette Runner) -->
  <g filter="url(#glow)" transform="translate(40, 20)">
    <!-- Head with runner headband -->
    <circle cx="210" cy="85" r="22" fill="#FFFFFF"/>
    <path d="M 195 80 L 225 82 L 230 78 L 200 76 Z" fill="#FF0B53"/>
    
    <!-- Torso (Athletic leaning forward) -->
    <path d="M 195 107 L 225 110 L 190 230 L 160 220 Z" fill="url(#bodyGrad)"/>
    
    <!-- Race Number Bib -->
    <rect x="175" y="140" width="36" height="42" rx="4" fill="#FFFFFF"/>
    <text x="193" y="162" font-family="'Impact', Arial" font-size="16" fill="#16042E" text-anchor="middle">10.5</text>
    <text x="193" y="174" font-family="'Arial'" font-weight="bold" font-size="7" fill="#FF0B53" text-anchor="middle">BOLÍVAR</text>

    <!-- Left Arm (Pumping forward) -->
    <path d="M 215 115 L 260 160 L 290 145" fill="none" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Right Arm (Backswing) -->
    <path d="M 180 120 L 130 150 L 100 135" fill="none" stroke="#A855F7" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Left Leg (Driving knee forward) -->
    <path d="M 185 225 L 245 285 L 270 370" fill="none" stroke="url(#bodyGrad)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Left Shoe -->
    <path d="M 265 370 L 305 380 L 300 395 L 255 385 Z" fill="#00D2FF"/>

    <!-- Right Leg (Trailing push-off) -->
    <path d="M 165 220 L 120 280 L 65 320" fill="none" stroke="#6D28D9" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Right Shoe -->
    <path d="M 65 320 L 40 345 L 30 335 L 58 312 Z" fill="#FF0B53"/>
  </g>

  <!-- Ground energy line -->
  <line x1="40" y1="410" x2="360" y2="410" stroke="rgba(255, 255, 255, 0.15)" stroke-width="2"/>
  <circle cx="280" cy="410" r="4" fill="#00D2FF"/>
</svg>

