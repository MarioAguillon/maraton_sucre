<section class="hero" id="inicio" aria-labelledby="hero-title">
  <!-- Vídeo de fondo (decorativo) -->
  <video
    #videoPlayer
    class="hero__video"
    [class.hero__video--visible]="isPlaying()"
    muted
    loop
    playsinline
    disablepictureinpicture
    [attr.preload]="videoRequested() ? 'metadata' : 'none'"
    aria-hidden="true"
    tabindex="-1"
  >
    @if (videoRequested()) {
      <source src="assets/videos/hero-maraton.mp4" type="video/mp4">
    }
  </video>
  <div class="hero__video-overlay" aria-hidden="true"></div>

  <!-- Contenido principal -->
  <div class="hero__content">
    <p class="hero__badge">
      <svg class="hero__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <rect x="3" y="5" width="18" height="16" rx="2" />
        <path d="M3 10h18M8 3v4M16 3v4" />
      </svg>
      <time datetime="2027-01-09T06:45-05:00">{{ dateLabel }}</time>
    </p>

    <h1 class="hero__title" id="hero-title">
      <span class="hero__title-fraction" aria-hidden="true">¼</span>
      <span class="hero__title-text">
        <span class="hero__sr-only">Cuarto de </span>MARATÓN
      </span>
      <span class="hero__title-cities">BOLÍVAR — SUCRE</span>
    </h1>

    <p class="hero__subtitle">
      Vive la emoción de correr entre dos pueblos hermanos.
      <span class="hero__subtitle-cta">¿Estás listo para el reto?</span>
    </p>

    <div class="hero__actions">
      <a href="#inscripcion" class="hero__cta hero__cta--primary">¡INSCRÍBETE AHORA!</a>
      <a href="#categorias" class="hero__cta hero__cta--secondary">VER CATEGORÍAS</a>
    </div>

    <ul class="hero__info-badges" aria-label="Datos clave de la carrera">
      <li class="hero__info-item">
        <svg class="hero__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z" />
          <circle cx="12" cy="9.5" r="2.5" />
        </svg>
        <span>{{ routeLabel }}</span>
      </li>
      <li class="hero__info-item">
        <svg class="hero__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <circle cx="12" cy="12" r="9" />
          <path d="M12 7v5l3 2" />
        </svg>
        <span>{{ startTimeLabel }} Salida</span>
      </li>
      <li class="hero__info-item">
        <svg class="hero__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M3 8a2 2 0 0 0 0 4v4a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-4a2 2 0 0 0 0-4V6a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2z" transform="translate(0 1)" />
          <path d="M14 5v14" stroke-dasharray="2 2" />
        </svg>
        <span>{{ feeLabel }}</span>
      </li>
    </ul>
  </div>

  <!-- Control del vídeo (WCAG 2.2.2: pausar contenido en movimiento) -->
  <button
    type="button"
    class="hero__video-toggle"
    (click)="toggleVideo()"
    [attr.aria-pressed]="isPlaying()"
    [attr.aria-label]="isPlaying() ? 'Pausar vídeo de fondo' : 'Reproducir vídeo de fondo'"
  >
    @if (isPlaying()) {
      <svg class="hero__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M9 6v12M15 6v12" />
      </svg>
    } @else {
      <svg class="hero__icon hero__icon--fill" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M8 5.5v13l11-6.5z" />
      </svg>
    }
  </button>

  <!-- Indicador de scroll -->
  <a href="#countdown" class="hero__scroll" aria-label="Ir a la siguiente sección">
    <span class="hero__scroll-mouse" aria-hidden="true">
      <span class="hero__scroll-wheel"></span>
    </span>
    <span aria-hidden="true">Desliza</span>
  </a>
</section>
